name: Deploy website

# Templates come from the KloudMate API at page load, so only a change to the
# site itself needs a deploy.
on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub Pages answers every path it has no file for with 404.html, which
      # is how `/<slug>/` reaches the page that renders the item.
      - name: Serve the app at every path
        run: cp site/index.html site/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: templates.kloudmate.com
